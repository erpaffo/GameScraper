<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameScraper">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="icon" href="/m/static/icon.png">
<link rel="apple-touch-icon" href="/m/static/apple-touch-icon.png">
<title>GameScraper</title>
<link rel="stylesheet" href="/m/static/m.css">
</head>
<body>
<div id="app">
  <!-- abbinamento -->
  <section id="pair" class="screen" hidden>
    <div class="pair-box">
      <div class="logo">◆</div>
      <h1>GameScraper</h1>
      <p class="muted">Inserisci il codice che vedi sul PC in <b>Impostazioni › Telefono</b> (o inquadra il QR).</p>
      <input id="pair-code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      <input id="pair-name" maxlength="40" placeholder="Nome di questo telefono">
      <button class="btn primary big" id="pair-go">Abbina</button>
      <p class="err" id="pair-err"></p>
    </div>
  </section>

  <!-- app -->
  <main id="main" hidden>
    <header class="top">
      <div class="brand"><span class="logo">◆</span> GameScraper</div>
      <div id="run-mini" hidden></div>
    </header>

    <section id="v-home" class="view"></section>
    <section id="v-lib" class="view" hidden>
      <div class="search-row">
        <input id="q" type="search" placeholder="Cerca un gioco…" autocomplete="off">
        <select id="plat"></select>
      </div>
      <div class="chips" id="lib-chips"></div>
      <div class="grid" id="grid"></div>
      <div id="more"></div>
    </section>

    <nav class="tabbar">
      <button data-tab="home" class="on"><span>🏠</span>Home</button>
      <button data-tab="lib"><span>🔍</span>Libreria</button>
      <button data-tab="pad"><span>🎮</span>Controller</button>
    </nav>
  </main>

  <!-- scheda del gioco -->
  <div id="sheet" hidden>
    <div class="sheet-bg"></div>
    <div class="sheet-box"></div>
  </div>

  <!-- controller -->
  <section id="pad" hidden>
    <div class="pad-bar">
      <button id="pad-exit">✕</button>
      <span id="pad-info">Collegamento…</span>
      <button id="pad-gyro" title="Giroscopio">🌀 Spento</button>
      <button id="pad-shot" title="Schermata">📷</button>
      <button id="pad-set">⚙</button>
    </div>
    <div class="pad-area" id="pad-area">
      <div class="shoulder l2" data-btn="lt">LT</div>
      <div class="shoulder l1" data-btn="lb">LB</div>
      <div class="shoulder r1" data-btn="rb">RB</div>
      <div class="shoulder r2" data-btn="rt">RT</div>
      <div class="stick" id="ls" data-stick="l"><div class="knob"></div></div>
      <div class="dpad" id="dpad"><span class="du">▲</span><span class="dd">▼</span><span class="dl">◀</span><span class="dr">▶</span></div>
      <div class="mid">
        <div class="small" data-btn="back">⧉</div>
        <div class="small guide" data-btn="guide">◆</div>
        <div class="small" data-btn="start">☰</div>
      </div>
      <div class="face">
        <div class="fb y" data-btn="y">Y</div>
        <div class="fb x" data-btn="x">X</div>
        <div class="fb b" data-btn="b">B</div>
        <div class="fb a" data-btn="a">A</div>
      </div>
      <div class="stick" id="rs" data-stick="r"><div class="knob"></div></div>
    </div>
    <div id="pad-rotate">Ruota il telefono in orizzontale 🔄</div>
    <div id="pad-settings" hidden>
      <h3>Impostazioni del controller</h3>
      <label>Giroscopio
        <select id="ps-gyro"><option value="off">Spento</option><option value="dsu">Movimento per gli emulatori (DSU)</option>
          <option value="aim">Mira (muove la levetta destra)</option></select></label>
      <label>Sensibilità della mira <input id="ps-sens" type="range" min="0.2" max="3" step="0.1"></label>
      <label class="chk"><input type="checkbox" id="ps-invx"> Inverti asse orizzontale (mira e movimento)</label>
      <label class="chk"><input type="checkbox" id="ps-invy"> Inverti asse verticale (mira e movimento)</label>
      <label class="chk"><input type="checkbox" id="ps-vib"> Vibrazione alla pressione</label>
      <label>Dimensione dei comandi <input id="ps-scale" type="range" min="0.8" max="1.3" step="0.05"></label>
      <p class="muted small" id="ps-help"></p>
      <button class="btn primary" id="ps-close">Fatto</button>
    </div>
  </section>

  <div id="toast" hidden></div>
</div>
<script src="/m/static/m.js"></script>
</body>
</html>
