# Crea gli eseguibili per Windows, macOS e Linux e li pubblica nella release.
#
# Avvio: crea e invia un tag di versione, es.
#   git tag v0.1.0 && git push origin v0.1.0
# oppure lancia il workflow a mano da GitHub (Actions > Release > Run workflow): in quel caso gli
# eseguibili restano scaricabili come "artifact" del workflow (direttamente lo zip / tar.gz, non uno zip
# dentro un altro zip), senza creare una release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3

      - name: Dipendenze Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Linux: finestra con Qt (autonoma). Senza, l'app si apre comunque nel browser.
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "pywebview[qt]"; fi

      - name: Test
        run: |
          python tests/test_policy.py
          python tests/test_discover.py

      - name: Build
        run: pyinstaller packaging/gamescraper.spec --noconfirm --distpath dist --workpath build

      - name: Pacchetto
        id: pack
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="dev-${GITHUB_SHA::7}"
          OUT="GameScraper-${VER}-${{ matrix.name }}"
          mkdir -p release
          case "$RUNNER_OS" in
            Windows) FILE="release/${OUT}.zip";    7z a -tzip "$FILE" ./dist/GameScraper >/dev/null ;;
            macOS)   FILE="release/${OUT}.zip";    ditto -c -k --keepParent dist/GameScraper.app "$FILE" ;;
            Linux)   FILE="release/${OUT}.tar.gz"; tar -czf "$FILE" -C dist GameScraper ;;
          esac
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          ls -la release

      # archive: false = il file (gia' uno zip / tar.gz) si scarica cosi' com'e', senza lo zip esterno che
      # upload-artifact aggiunge di solito; il nome dell'artifact e' il nome del file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
