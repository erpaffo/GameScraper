# Crea gli eseguibili per Windows, macOS e Linux e li pubblica nella release: per ogni sistema la versione
# portatile (zip / tar.gz) e l'installer (Windows setup.exe, macOS .dmg, Linux .deb).
#
# Avvio: crea e invia un tag di versione, es.
#   git tag v0.1.0 && git push origin v0.1.0
# oppure lancia il workflow a mano da GitHub (Actions > Release > Run workflow): in quel caso gli
# eseguibili restano scaricabili come "artifact" del workflow (direttamente lo zip / tar.gz, non uno zip
# dentro un altro zip), senza creare una release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        # librerie del plugin xcb di Qt (le stesse sono le dipendenze del .deb, piu' sotto)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 xvfb

      - name: Dipendenze Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Linux: finestra con Qt (autonoma). Senza, l'app si apre comunque nel browser.
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "pywebview[qt]"; fi

      - name: Test
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"  # l'output dei test arriva subito: un blocco si vede dove succede
        run: python packaging/run_tests.py

      - name: Build
        run: pyinstaller packaging/gamescraper.spec --noconfirm --distpath dist --workpath build

      - name: Prova di avvio (smoke test)
        shell: bash
        env:
          QT_DEBUG_PLUGINS: "1"  # se Qt non parte, il log dice quale libreria manca davvero
        run: |
          # Verifica che l'eseguibile compilato si avvii e risponda su GET /api/status (su Linux serve Xvfb per la GUI Qt).
          case "$RUNNER_OS" in
            Windows) python packaging/smoke_test.py dist/GameScraper/GameScraper.exe ;;
            macOS)   python packaging/smoke_test.py dist/GameScraper.app ;;
            Linux)   xvfb-run -a python packaging/smoke_test.py dist/GameScraper/GameScraper ;;
          esac

      - name: Pacchetto
        id: pack
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # avvio a mano da un branch: la versione scritta nel codice
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' gamescraper/__init__.py | tr -d '\r')
          OUT="GameScraper-${VER}-${{ matrix.name }}"
          mkdir -p release
          case "$RUNNER_OS" in
            Windows) FILE="release/${OUT}.zip";    7z a -tzip "$FILE" ./dist/GameScraper >/dev/null ;;
            macOS)   FILE="release/${OUT}.zip";    ditto -c -k --keepParent dist/GameScraper.app "$FILE" ;;
            Linux)   FILE="release/${OUT}.tar.gz"; tar -czf "$FILE" -C dist GameScraper ;;
          esac
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          ls -la release

      # Installer accanto alla versione portatile: Windows .exe (Inno Setup), macOS .dmg, Linux .deb.
      # I nomi dei file sono quelli che cerca l'aggiornamento dall'app (gamescraper/updates.py, SUFFIX).
      - name: Installer
        id: inst
        shell: bash
        run: |
          VER="${{ steps.pack.outputs.ver }}"
          case "$RUNNER_OS" in
            Windows)
              choco install innosetup -y --no-progress >/dev/null
              "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DAppVersion=$VER" packaging/installer.iss
              FILE="release/GameScraper-${VER}-windows-x64-setup.exe" ;;
            macOS)
              mkdir dmg && cp -R dist/GameScraper.app dmg/ && ln -s /Applications dmg/Applications
              FILE="release/GameScraper-${VER}-macos-arm64.dmg"
              hdiutil create -volname GameScraper -srcfolder dmg -ov -format UDZO "$FILE" ;;
            Linux)
              DEBVER="$VER"; [[ "$VER" =~ ^[0-9] ]] || DEBVER="0.0.0~$VER"  # dpkg vuole un numero all'inizio
              P=pkg
              mkdir -p $P/DEBIAN $P/opt $P/usr/bin $P/usr/share/applications $P/usr/share/pixmaps
              cp -r dist/GameScraper $P/opt/GameScraper
              ln -s /opt/GameScraper/GameScraper $P/usr/bin/gamescraper
              cp packaging/icon.png $P/usr/share/pixmaps/gamescraper.png
              printf '%s\n' "[Desktop Entry]" "Type=Application" "Name=GameScraper" \
                "Comment=Libreria di giochi: ROM e store PC" "Exec=/opt/GameScraper/GameScraper" \
                "Icon=gamescraper" "Categories=Game;" > $P/usr/share/applications/gamescraper.desktop
              printf '%s\n' "Package: gamescraper" "Version: $DEBVER" "Architecture: amd64" "Maintainer: erpaffo" \
                "Depends: libegl1, libnss3, libxkbcommon-x11-0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xfixes0, libxcb-xinerama0, libxcb-xkb1" \
                "Description: GameScraper - libreria di giochi con copertine e metadati" > $P/DEBIAN/control
              FILE="release/gamescraper_${DEBVER}_amd64.deb"
              dpkg-deb --root-owner-group --build $P "$FILE" ;;
          esac
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          ls -la release

      # archive: false = il file (gia' uno zip / tar.gz) si scarica cosi' com'e', senza lo zip esterno che
      # upload-artifact aggiunge di solito; il nome dell'artifact e' il nome del file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.inst.outputs.file }}
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
          # gli artifact sono gia' i file finali (archive: false): senza questo gli .zip portatili
          # verrebbero estratti in cartelle e mancherebbero nella release
          skip-decompress: true

      # manuale in PDF tra i file della release (stesso testo del sito, vedi docs.yml)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Manuale PDF
        run: |
          pip install pyyaml
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-italian fonts-dejavu-core
          python tools/docs_pdf.py "release/GameScraper-${GITHUB_REF_NAME#v}-manuale.pdf"

      # testo della release: la sezione "## <versione>" di changelog.md (fino alla sezione seguente)
      - name: Novità della versione
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## /{p = ($2 == v); next} p' changelog.md > notes.md
          [ -s notes.md ] || echo "Nessuna voce per la versione $VER in changelog.md." > notes.md
          cat notes.md

      # impronte SHA-256 di tutti i file: chi scarica puo' verificare che siano integri (gli eseguibili non sono firmati)
      - name: Checksum
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md
